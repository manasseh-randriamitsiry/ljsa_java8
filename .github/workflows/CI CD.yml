name: JavaFX CI/CD with Java 11 and EXE Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  # 🧱 1️⃣ Linux job: Build the JAR with SQLite
  build-jar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # No database service needed for SQLite

      - name: Build JAR with dependencies
        run: mvn -B clean package -DskipTests --file pom.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ljsa-jar
          path: target/*.jar

  # 🪟 2️⃣ Windows job: Create executable using launch4j
  package-exe:
    runs-on: windows-latest
    needs: build-jar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build JAR on Windows (for Windows JavaFX natives)
        run: mvn -B clean package -DskipTests --file pom.xml

      - name: Download and setup launch4j
        shell: pwsh
        run: |
          Write-Host "Downloading launch4j..."
          $launch4jZip = "launch4j.zip"
          $launch4jDir = "launch4j"
          Invoke-WebRequest -Uri https://github.com/mrdon/launch4j/releases/download/launch4j-3.14/launch4j-3.14-win32.zip -OutFile $launch4jZip

          Write-Host "Extracting launch4j..."
          Expand-Archive -Path $launch4jZip -DestinationPath $launch4jDir -Force

          Write-Host "Contents of launch4j directory:"
          Get-ChildItem -Path $launch4jDir

          Write-Host "Contents of current directory:"
          Get-ChildItem -Path .

          Write-Host "Finding JAR file..."
          $jarFile = Get-ChildItem -Path target -Filter *.jar | Where-Object { $_.Name -notmatch "original" } | Select-Object -First 1
          if (-not $jarFile) {
            throw "JAR file not found in target directory."
          }
          Write-Host "Found JAR file: $($jarFile.Name)"

          Write-Host "Creating launch4j configuration..."
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <launch4jConfig>
            <dontWrapJar>false</dontWrapJar>
            <headerType>gui</headerType>
            <jar>target/$($jarFile.Name)</jar>
            <outfile>ljsa.exe</outfile>
            <errTitle>LJSA Error</errTitle>
            <cmdLine></cmdLine>
            <chdir></chdir>
            <priority>normal</priority>
            <downloadUrl>https://www.java.com/download/</downloadUrl>
            <supportUrl></supportUrl>
            <stayAlive>false</stayAlive>
            <restartOnCrash>false</restartOnCrash>
            <manifest></manifest>
            <icon></icon>
            <jre>
              <path></path>
              <bundledJre64Bit>false</bundledJre64Bit>
              <bundledJreAsFallback>false</bundledJreAsFallback>
              <minVersion>11.0.0</minVersion>
              <maxVersion></maxVersion>
              <jdkPreference>preferJre</jdkPreference>
              <runtimeBits>64/32</runtimeBits>
            </jre>
            <splash>
              <file></file>
              <waitForWindow>true</waitForWindow>
              <timeout>60</timeout>
              <timeoutErr>true</timeoutErr>
            </splash>
          </launch4jConfig>
          "@ | Set-Content -Path ljsa.xml -Encoding UTF8

      - name: Create EXE using launch4j
        shell: pwsh
        run: |
          Write-Host "Running launch4j to create EXE..."
          $launch4jExe = Get-ChildItem -Path launch4j -Filter launch4j.exe -Recurse | Select-Object -First 1
          if (-not $launch4jExe) {
            throw "launch4j.exe not found in launch4j directory."
          }

          Write-Host "Found launch4j executable: $($launch4jExe.FullName)"
          & $launch4jExe.FullName (Resolve-Path ljsa.xml)
          if ($LASTEXITCODE -ne 0) {
            throw "launch4j failed with exit code $LASTEXITCODE."
          }

          Write-Host "Checking if EXE was created..."
          if (-not (Test-Path ljsa.exe)) {
            Write-Host "Error: ljsa.exe was not created"
            Get-ChildItem -Path .
            Get-ChildItem -Path target
            Get-Content ljsa.xml
            throw "launch4j output missing."
          }

          Write-Host "ljsa.exe created successfully"
          Get-ChildItem -Path ljsa.exe

          Write-Host "Creating dist directory..."
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path ljsa.exe -Destination dist
          Copy-Item -Path target/*.jar -Destination dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ljsa-exe
          path: dist

  # 🚀 3️⃣ Release job: Publish GitHub release for version tags or manual dispatch
  release:
    runs-on: ubuntu-latest
    needs: package-exe
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: ljsa-exe
          path: dist

      - name: List files for release
        run: |
          echo "Files in dist directory:"
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ljsa.exe
            dist/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
